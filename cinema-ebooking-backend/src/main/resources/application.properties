# application.properties

spring.application.name=cinema-ebooking-backend
server.port=8080

# MongoDB connection (override with the MONGODB_URI environment variable, e.g. for Atlas)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cinema_ebooking}

# Origins allowed to call the API (the Vite dev server by default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Set to true to wipe and re-seed the movies collection on startup
app.seed.reset=${SEED_RESET:false}
